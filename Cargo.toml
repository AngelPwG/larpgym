[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "v5", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
rusqlite = { version = "0.40", features = ["bundled", "backup"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net", "time", "sync"] }
axum = "0.8"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "query"] }
# Exact wrapped paragraph height keeps Vim's G/scroll bounds correct in small terminals.
ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }
crossterm = "0.29"
toml = "0.9"
fs2 = "0.4"
subtle = "2"
sha2 = "0.10"
tempfile = "3"
gym-core = { path = "crates/gym-core" }
gym-storage = { path = "crates/gym-storage" }
gym-sync = { path = "crates/gym-sync" }
gym-server = { path = "crates/gym-server" }
